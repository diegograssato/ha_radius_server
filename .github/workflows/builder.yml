# yamllint disable rule:line-length rule:truthy
---
name: Build addon

env:
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs"
  ARCHITECTURES: '["amd64", "aarch64", "armv7"]'

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  release:
    types: ["published"]

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_files: ${{ steps.changed_files.outputs.all }}
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            head="${{ github.sha }}"
          fi

          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t files < <(git ls-tree -r --name-only "${head}")
          else
            mapfile -t files < <(git diff --name-only "${base}" "${head}")
          fi

          changed=""
          if (( ${#files[@]} > 0 )); then
            changed="$(printf '%s ' "${files[@]}")"
            changed="${changed% }"
          fi

          echo "all=${changed}" >> "$GITHUB_OUTPUT"

      - name: Get addons
        id: addons
        run: |
          declare -a addons
          for addon in $(find ./ -name config.yaml | cut -d "/" -f2 | sort -u); do
            addons+=("$addon");
          done
          echo "addons=${addons[@]}" >> "$GITHUB_OUTPUT"

      - name: Get changed addons
        id: changed_addons
        run: |
          declare -a changed_addons
          for addon in ${{ steps.addons.outputs.addons }}; do
            if [[ "${{ steps.changed_files.outputs.all }}" =~ $addon ]]; then
              for file in ${{ env.MONITORED_FILES }}; do
                if [[ "${{ steps.changed_files.outputs.all }}" =~ $addon/$file ]]; then
                  if [[ ! "${changed_addons[@]}" =~ $addon ]]; then
                    changed_addons+=("\"${addon}\",");
                  fi
                fi
              done
            fi
          done
          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)
          if [[ -n ${changed} ]]; then
            echo "Changed addons: $changed";
            echo "changed=true" >> "$GITHUB_OUTPUT";
            echo "addons=[$changed]" >> "$GITHUB_OUTPUT";
          else
            echo "No addon had any monitored files changed (${{ env.MONITORED_FILES }})";
          fi

  matrix-gen:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Generate build matrix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate matrix for ${{ matrix.addon }}
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ matrix.addon }}

  build:
    needs: matrix-gen
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-gen.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build addon image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          build-dir: ./${{ matrix.image }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          version: ${{ github.ref_name }}
